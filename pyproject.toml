[project]
name = "apple-watch-hypertension-skill"
version = "0.2.0"
description = "Portable agent skill for Apple Watch hypertension notification setup"
requires-python = ">=3.11"
license = "GPL-3.0-only"
dependencies = ["cryptography==50.0.2", "pymobiledevice3==11.40.0"]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2", "ruff>=0.9,<1", "pyyaml>=6,<7"]

[tool.pytest.ini_options]
pythonpath = ["scripts"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]
