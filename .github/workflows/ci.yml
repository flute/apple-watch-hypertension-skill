name: Offline checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.9.25"
          python-version: "3.11"
      - run: uv sync --frozen
      - run: uv run --frozen ruff check scripts tests
      - run: uv run --frozen ruff format --check scripts tests
      - run: uv run --frozen pytest -q
      - run: uv run --frozen python scripts/build_release.py
